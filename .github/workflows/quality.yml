name: Offline quality checks
on: [push, pull_request]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-plugin.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_examples.py --check
      - run: python scripts/plugin_run.py --input examples/plugin-input.json
      - run: python scripts/plugin_run.py --input examples/plugin-input.json --plan examples/team-pulse-plan.json --output-dir output/ci-team
      - run: python scripts/plugin_run.py --input examples/fitcheck-input.json --plan examples/fitcheck-plan.json --output-dir output/ci-fitcheck
      - run: python scripts/generate_prd.py --input examples/sample_requirement.md --competitors examples/sample_competitors.csv --output examples/generated_prd.md --rules configs/prd_rules.yaml --dry-run
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:review
      - uses: actions/upload-artifact@v4
        with:
          name: review-browser-evidence
          path: |
            output/browser-check/acceptance.json
            .impeccable/review/*.png
          include-hidden-files: true
  portfolio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/portfolio_audit.ps1
