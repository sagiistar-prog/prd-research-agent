project_name: PRD Research Agent
language: zh-CN
prd_version: v0.3
dry_run_mode: offline_evidence_review
compatibility_note: Legacy --rules is accepted but does not inject features or timelines.
plan_contract: schemas/plan.schema.json
quality_rules:
  - 功能关联用户问题和证据或假设
  - 优先级说明取舍而非按顺序分配
  - 验收条件描述可观察结果
  - 约束需要显式响应
  - 迭代按退出条件推进
